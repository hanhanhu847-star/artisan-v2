<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISAN 接入示例</title><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="themes.css"><script src="../../BROWSER/catalog-data.js" defer></script><script src="example.js" defer></script><style>body{max-width:900px;margin:25px auto;padding:0 15px}select{padding:7px}main{margin-top:15px}.at-panel{margin:14px 0}img{max-width:100%}.hero{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:10px}label{display:block;margin-bottom:12px}</style></head><body><label>预览风格 <select id="style"></select></label><main data-artisan="bauhaus" id="demo"><div class="hero"><div><span class="at-tag">个人图册</span><h1 id="title">图版收藏</h1></div><img id="illustration" alt="当前风格插图"></div><section class="at-panel"><h2>添加图版</h2><form id="form" novalidate><label>名称 <input id="name" class="at-field" maxlength="60" aria-describedby="message"></label><button class="at-button">添加</button><p id="message" role="status"></p></form></section><section class="at-card"><h2>本次收藏</h2><p id="empty" class="at-empty">尚未添加图版。</p><ul class="at-list" id="list"></ul></section></main></body></html>
